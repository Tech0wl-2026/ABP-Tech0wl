<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova de certificação | Aprendizagem Ágil</title>
    <link rel="stylesheet" href="src/css/questao.css">
    <link rel="stylesheet" href="src/css/parcial.css">

    <!-- Proteção: só entra quem fez login (o auth.js fica na pasta login) -->
    <script src="src/js/auth.js"></script>
    <script>exigirLogin();</script>
    <script src="src/js/certificado.js"></script>
    <script src="src/js/prova.js" defer></script>
</head>
<body>

    <main class="prova">

        <h1 class="titulo">
            <span class="seta seta-esq" aria-hidden="true"></span>
            Prova de certificação
            <span class="seta seta-dir" aria-hidden="true"></span>
        </h1>

        <!-- Tempo restante da pergunta (o questao.js controla a largura) -->
        <div class="barra" id="barra" role="progressbar" aria-label="Tempo restante da pergunta" aria-valuemin="0" aria-valuemax="150" aria-valuenow="150">
            <div class="barra-preenchimento" id="barra-preenchimento"></div>
        </div>

        <div class="corpo">

            <!-- ESQUERDA: contador, enunciado e figura -->
            <section class="coluna-pergunta">
                <p class="contador" id="contador"></p>
                <p class="media" id="media"></p>

                <div class="cartao-pergunta">
                    <p class="enunciado" id="enunciado"></p>
                    <img class="figura" id="figura" alt="" hidden>
                </div>
            </section>

            <!-- DIREITA: alternativas e botões -->
            <section class="coluna-respostas">
                <div class="respostas-topo">
                    <h2 id="selecione">Selecione 1 alternativa</h2>
                    <p class="tempo" id="tempo" role="timer">150s</p>
                </div>

                <div class="alternativas" id="alternativas" role="radiogroup" aria-labelledby="selecione"></div>

                <div class="acoes">
                    <button type="button" class="botao" id="btn-parar">Parar prova</button>
                    <button type="button" class="botao" id="btn-proxima">Ir para a próxima pergunta</button>
                </div>
            </section>

        </div>

        <nav class="paginacao" id="paginacao" aria-label="Perguntas da prova"></nav>
    </main>

    <!-- CONFIRMAÇÃO: continuar ou parar a prova -->
    <dialog class="dialogo" id="dialogo-parar" aria-labelledby="parar-titulo" aria-describedby="parar-texto">
        <h2 id="parar-titulo">Deseja parar a prova?</h2>
        <p id="parar-texto">O tempo fica pausado enquanto você decide. Se parar, seu progresso é salvo e você continua de onde parou quando quiser.</p>
        <div class="dialogo-acoes">
            <button type="button" class="botao botao-secundario" id="btn-confirmar-parar">Parar prova</button>
            <button type="button" class="botao" id="btn-continuar" autofocus>Continuar prova</button>
        </div>
    </dialog>

    <!-- PROVA PAUSADA: o que acertou, o que errou e o tempo que falta (aparece ao parar) -->
    <dialog class="dialogo" id="dialogo-parcial" aria-labelledby="parcial-titulo" aria-describedby="parcial-texto">
        <h2 id="parcial-titulo">Prova pausada</h2>
        <p id="parcial-texto"></p>
        <ul class="parcial-lista" id="parcial-lista"></ul>
        <div class="dialogo-acoes">
            <a class="botao" id="btn-parcial-voltar" href="./home.html">Voltar ao portal</a>
        </div>
    </dialog>

</body>
</html>
