<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de certificado | Tech0wl</title>
    <link rel="stylesheet" href="src/css/validar.css">
    <script src="src/js/validar.js" defer></script>
</head>
<body>

    <header class="topo">
        <span class="marca">Aprendizagem Ágil</span>
        <span class="inst">Tech0wl</span>
    </header>

    <main class="pagina">
        <section class="cartao" aria-labelledby="titulo">

            <!-- Estado preenchido pelo validar.js: data-estado="valido" | "invalido" -->
            <div id="status" class="status" data-estado="carregando" role="status" aria-live="polite">
                <svg id="icone-ok" class="icone" viewBox="0 0 24 24" aria-hidden="true" hidden>
                    <circle cx="12" cy="12" r="11" fill="currentColor"/>
                    <path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg id="icone-erro" class="icone" viewBox="0 0 24 24" aria-hidden="true" hidden>
                    <circle cx="12" cy="12" r="11" fill="currentColor"/>
                    <path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
                <div>
                    <h1 id="titulo">Verificando…</h1>
                    <p id="texto"></p>
                </div>
            </div>

            <dl id="dados" class="dados" hidden>
                <div><dt>Nome</dt><dd id="d-nome"></dd></div>
                <div><dt>CPF</dt><dd id="d-cpf"></dd></div>
                <div><dt>Data de emissão</dt><dd id="d-data"></dd></div>
                <div><dt>Código do certificado</dt><dd id="d-codigo"></dd></div>
            </dl>

            <p id="exemplo" class="exemplo" hidden>
                Esta página é aberta pelo QR Code do certificado.
                <a id="link-exemplo" href="#">Ver um exemplo</a>
            </p>
        </section>
    </main>

</body>
</html>
