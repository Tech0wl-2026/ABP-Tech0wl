<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="src/css/cadastro.css">
    <link rel="stylesheet" href="src/css/mensagens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

    <div class="wrapper">
        <form action="" id="form-cadastro">
            <h1>Cadastro</h1>

            <div class="input-box">
                <input type="text" id="nome" placeholder="Nome completo" autocomplete="name" required>
                <i class="bx bx-user-circle bx-remove-padding"></i>
            </div>
            <div class="input-box">
                <input type="text" id="cpf" placeholder="CPF" inputmode="numeric" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="email" id="email" placeholder="Email" autocomplete="email" required>
                <i class="bx bx-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" id="senha" placeholder="Senha" autocomplete="new-password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <input type="password" id="confirmar" placeholder="Confirmar senha" autocomplete="new-password" required>
                <i class="bx bx-lock-alt"></i>
            </div>

            <p id="mensagem" class="mensagem" role="alert"></p>

            <button type="submit" class="btn">Cadastro</button>

            <div class="register-link">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </form>
    </div>

    <script src="src/js/auth.js"></script>
    <script src="src/js/cadastro.js"></script>
</body>
</html>
