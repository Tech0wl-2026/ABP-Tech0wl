<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="src/css/esqueci-senha.css">
    <link rel="stylesheet" href="src/css/mensagens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="wrapper">
        <form action="" id="form-esqueci">

            <div class="lock"></div>
            <h1>Recuperação de senha</h1>

                <div class="recup">
                    <p>Informe o email da sua preferência para recuperar sua senha.</p>
                </div>

                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" autocomplete="email" required>
                    <i class="bx bx-envelope"></i>
                </div>
                <p id="mensagem" class="mensagem" role="alert"></p>
                <button type="submit" class="btn">Recuperar senha</button>

                <div class="register-link">
                    <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
                </div>
            </div>
        </form>
    </div>
    <script src="src/js/esqueci-senha.js"></script>
</body>
</html>
