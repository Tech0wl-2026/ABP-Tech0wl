<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="src/css/senha-nov.css">
    <link rel="stylesheet" href="src/css/mensagens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/css/mobile.css">
</head>
<body>
    
    <div class="wrapper">
        <form action="" id="form-nova-senha">

            <div class="lockout"></div>
            <h1>Nova senha</h1>

                <div class="recup">
                    <p>Defina uma nova senha para sua conta.</p>
                </div>

                <div id="campos">
                    <div class="input-box">
                        <input type="password" id="senha" placeholder="Nova senha" autocomplete="new-password" required>
                        <i class="bx bx-lock"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="confirmar" placeholder="Confirmar nova senha" autocomplete="new-password" required>
                        <i class="bx bx-lock"></i>
                    </div>
                </div>

                <p id="mensagem" class="mensagem" role="alert"></p>

                <button type="submit" class="btn" id="btn-definir">Definir nova senha</button>

                <div id="pedir-novo" class="register-link" style="display:none">
                    <p><a href="esqueci_senha.html">Pedir um novo link</a></p>
                </div>

                <div class="register-link">
                    <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
                </div>
            </div>
        </form>
    </div>
    <script src="src/js/esqueci-senha.js"></script>
</body>
</html>
