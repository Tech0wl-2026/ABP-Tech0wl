<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="src/css/login.css">
    <link rel="stylesheet" href="src/css/mensagens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <a href="index.html" class="back-btn">
    <img src="src/images/bi_arrow-left-circle.png" alt="Voltar">
    </a>
    
    <div class="wrapper">
        <form action="" id="form-login">
            <h1>Login</h1>

            <div class="input-box">
                <input type="text" id="cpf" placeholder="CPF" inputmode="numeric" autocomplete="username" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
                <i class="bx bx-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox" id="lembrar">Lembrar-me</label>
                <a href="esqueci_senha.html">Esqueceu a senha?</a>
            </div>

            <p id="mensagem" class="mensagem" role="alert"></p>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </form>
    </div>

    <script src="src/js/auth.js"></script>
    <script src="src/js/login.js"></script>
</body>
</html>
