<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Nova senha</title>
    <link rel="stylesheet" href="styles4.css">
    <link rel="stylesheet" href="mensagens.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

    <div class="wrapper">
        <form action="" id="form-nova-senha">

            <div class="lockout"></div>
            <h1>Nova senha</h1>

            <div class="recup">
                <p>Defina uma nova senha para sua conta.</p>
            </div>

            <div id="campos">
                <div class="input-box">
                    <input type="password" id="senha" placeholder="Nova senha" autocomplete="new-password" minlength="6" required>
                    <i class="bx bx-lock"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="confirmar" placeholder="Confirmar nova senha" autocomplete="new-password" minlength="6" required>
                    <i class="bx bx-lock-alt"></i>
                </div>
            </div>

            <p id="mensagem" class="mensagem" role="alert"></p>

            <button type="submit" class="btn" id="btn-definir">Definir nova senha</button>

            <div class="register-link" id="pedir-novo" style="display:none">
                <p><a href="esqueci_senha.html">Pedir um novo link</a></p>
            </div>

            <div class="register-link">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </form>
    </div>

    <script src="esqueci-senha.js"></script>
</body>
</html>
