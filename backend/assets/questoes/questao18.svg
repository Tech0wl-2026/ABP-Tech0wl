<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Um plano que acompanha o aprendizado</title><desc id="desc">Meta mantida: Permitir que o candidato conclua a avaliação no portal.; Descoberta: Ao testar o cronômetro, os Developers encontram um problema de sincronização.; Atualização: Eles detalham novas atividades de correção no plano da Sprint.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#0f766e"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Um plano que acompanha o aprendizado</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#0f766e"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Meta mantida</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Permitir que o candidato</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">conclua a avaliação no</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">portal.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#0f766e"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Descoberta</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Ao testar o cronômetro, os</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Developers encontram um</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">problema de sincronização.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#0f766e"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Atualização</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Eles detalham novas</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">atividades de correção no</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">plano da Sprint.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 6: Artefatos do Scrum • Questão 2</text></svg>