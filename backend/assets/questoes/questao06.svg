<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Uma equipe que decide como trabalhar</title><desc id="desc">Capacidades reunidas: O grupo possui competências de interface, programação, banco de dados e testes.; Objetivo comum: Todos trabalham para entregar uma avaliação utilizável no portal.; Organização interna: Os integrantes decidem entre si quem faz cada atividade e como colaborar.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#0f766e"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Uma equipe que decide como trabalhar</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#0f766e"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Capacidades reunidas</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O grupo possui</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">competências de</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">interface, programação,</text><text x="72" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">banco de dados e testes.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#0f766e"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Objetivo comum</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Todos trabalham para</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">entregar uma avaliação</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">utilizável no portal.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#0f766e"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Organização interna</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Os integrantes decidem</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">entre si quem faz cada</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">atividade e como</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">colaborar.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Introdução ao Scrum • Questão 2 • Analise as informações do cenário.</text></svg>