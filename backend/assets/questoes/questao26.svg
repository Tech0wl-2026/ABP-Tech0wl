<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">A etapa de testes acumula trabalho</title><desc id="desc">Desenvolvimento: Dois itens em andamento.; Testes: Cinco itens aguardam verificação; o mais antigo espera há quatro dias.; Conclusão: Nenhum item foi concluído nos últimos dois dias.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#0369a1"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">A etapa de testes acumula trabalho</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#0369a1"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Desenvolvimento</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Dois itens em andamento.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0369a1" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#0369a1"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Testes</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Cinco itens aguardam</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">verificação; o mais antigo</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">espera há quatro dias.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0369a1" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#0369a1"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Conclusão</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Nenhum item foi concluído</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">nos últimos dois dias.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 9: Kanban • Questão 2</text></svg>