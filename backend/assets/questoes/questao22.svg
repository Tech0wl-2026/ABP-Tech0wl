<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Tornar um item compreensível</title><desc id="desc">Antes: Item do Product Backlog: melhorar a área de estudos.; Discussão: Product Owner e Developers esclarecem filtros, exemplos e o resultado esperado.; Depois: O item é dividido em partes menores e recebe detalhes e estimativas.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#4338ca"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Tornar um item compreensível</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#4338ca"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Antes</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Item do Product Backlog:</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">melhorar a área de estudos.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#4338ca" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#4338ca"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Discussão</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Product Owner e</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Developers esclarecem</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">filtros, exemplos e o</text><text x="450" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">resultado esperado.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#4338ca" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#4338ca"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Depois</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">O item é dividido em partes</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">menores e recebe detalhes</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">e estimativas.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 8: Gestão do Product Backlog • Questão 2</text></svg>