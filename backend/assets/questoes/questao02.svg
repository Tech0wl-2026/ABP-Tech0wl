<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">O portal cresce por entregas</title><desc id="desc">Entrega 1: O candidato já consegue estudar por tema.; Entrega 2: A mesma versão recebe avaliação com questões e cronômetro.; Entrega 3: O portal passa a oferecer histórico e certificado verificável.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#2563eb"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">O portal cresce por entregas</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#2563eb"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Entrega 1</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O candidato já consegue</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">estudar por tema.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#2563eb"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Entrega 2</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A mesma versão recebe</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">avaliação com questões e</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">cronômetro.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#2563eb"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Entrega 3</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O portal passa a</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">oferecer histórico e</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">certificado verificável.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Fundamentos da Agilidade • Questão 2 • Analise as informações do cenário.</text></svg>