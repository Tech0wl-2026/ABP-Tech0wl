<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Melhorar o modo de trabalhar</title><desc id="desc">Problema: Na Sprint encerrada, mudanças de código provocaram conflitos de integração.; Análise: O Scrum Team examina suas interações, ferramentas e práticas.; Melhoria: Combina integrar pequenas alterações mais cedo e avaliar o resultado na próxima Sprint.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#7c3aed"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Melhorar o modo de trabalhar</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#7c3aed"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Problema</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Na Sprint encerrada,</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">mudanças de código</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">provocaram conflitos de</text><text x="72" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">integração.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#7c3aed"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Análise</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">O Scrum Team examina</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">suas interações,</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">ferramentas e práticas.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#7c3aed"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Melhoria</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Combina integrar pequenas</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">alterações mais cedo e</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">avaliar o resultado na</text><text x="828" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">próxima Sprint.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 5: Eventos do Scrum • Questão 4</text></svg>