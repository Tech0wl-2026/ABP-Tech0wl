<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Quinze minutos para ajustar o caminho</title><desc id="desc">Participantes: Os Developers se reúnem durante a Sprint.; Foco: Examinam o progresso em direção à Meta da Sprint.; Ajuste: Adaptam o plano do próximo dia. O evento dura até 15 minutos.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#7c3aed"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Quinze minutos para ajustar o caminho</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#7c3aed"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Participantes</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Os Developers se reúnem</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">durante a Sprint.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#7c3aed"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Foco</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Examinam o progresso em</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">direção à Meta da Sprint.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#7c3aed"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Ajuste</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Adaptam o plano do</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">próximo dia. O evento dura</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">até 15 minutos.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 5: Eventos do Scrum • Questão 2</text></svg>