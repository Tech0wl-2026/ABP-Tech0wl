<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Puxar quando há capacidade</title><desc id="desc">Política: A coluna Em testes aceita no máximo 2 itens.; Situação: Um item está em testes; há outro desenvolvido e pronto para ser testado.; Movimento: Quem testa puxa o próximo item, respeitando a capacidade e os critérios de entrada.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#0369a1"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Puxar quando há capacidade</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#0369a1"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Política</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">A coluna Em testes aceita</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">no máximo 2 itens.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0369a1" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#0369a1"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Situação</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Um item está em testes; há</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">outro desenvolvido e pronto</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">para ser testado.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0369a1" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#0369a1"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Movimento</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Quem testa puxa o próximo</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">item, respeitando a</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">capacidade e os critérios de</text><text x="828" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">entrada.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 9: Kanban • Questão 3</text></svg>