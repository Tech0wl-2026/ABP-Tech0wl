roke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#0f766e"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Burndown: dias 3 a 5</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">15 pontos restantes em</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">cada dia; não há registro de</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">mudança no escopo.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 11: Métricas Ágeis • Questão 2</text></svg>