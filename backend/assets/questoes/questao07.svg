<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">O que acontece dentro da Sprint</title><desc id="desc">Início: A equipe planeja uma Sprint de duas semanas com uma meta definida.; Durante as duas semanas: Desenvolve, testa, integra e inspeciona o progresso diariamente.; Antes de encerrar: Inspeciona o resultado com interessados e reflete sobre melhorias no trabalho.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#0f766e"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">O que acontece dentro da Sprint</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#0f766e"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Início</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe planeja uma</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">Sprint de duas semanas</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">com uma meta definida.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#0f766e"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Durante as duas semanas</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Desenvolve, testa,</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">integra e inspeciona o</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">progresso diariamente.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#0f766e"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Antes de encerrar</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Inspeciona o resultado</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">com interessados e</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">reflete sobre melhorias</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">no trabalho.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Introdução ao Scrum • Questão 3 • Analise as informações do cenário.</text></svg>