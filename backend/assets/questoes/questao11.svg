<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Quem decide a solução técnica?</title><desc id="desc">Necessidade: O portal deve encerrar a questão quando o tempo se esgotar.; Planejamento técnico: Os integrantes que constroem o Incremento escolhem a solução e dividem o trabalho.; Durante a Sprint: Eles atualizam seu plano para atingir a Meta da Sprint.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#2563eb"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Quem decide a solução técnica?</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#2563eb"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Necessidade</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">O portal deve encerrar a</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">questão quando o tempo se</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">esgotar.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#2563eb"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Planejamento técnico</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Os integrantes que</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">constroem o Incremento</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">escolhem a solução e</text><text x="450" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">dividem o trabalho.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#2563eb"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Durante a Sprint</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Eles atualizam seu plano</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">para atingir a Meta da</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Sprint.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 4: Papéis do Scrum • Questão 3</text></svg>