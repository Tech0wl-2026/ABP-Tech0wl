<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Por que, o quê e como?</title><desc id="desc">Valor: O Scrum Team define por que a próxima Sprint é valiosa.; Seleção: Os Developers selecionam itens com o Product Owner, considerando sua capacidade.; Plano: Os Developers planejam como produzir um Incremento que atenda à Definition of Done.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#7c3aed"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Por que, o quê e como?</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#7c3aed"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Valor</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">O Scrum Team define por</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">que a próxima Sprint é</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">valiosa.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#7c3aed"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Seleção</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Os Developers selecionam</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">itens com o Product Owner,</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">considerando sua</text><text x="450" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">capacidade.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#7c3aed" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#7c3aed"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Plano</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Os Developers planejam</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">como produzir um</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Incremento que atenda à</text><text x="828" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Definition of Done.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 5: Eventos do Scrum • Questão 1</text></svg>