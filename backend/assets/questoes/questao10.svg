<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Um impedimento de infraestrutura</title><desc id="desc">Bloqueio: A equipe perdeu o acesso ao ambiente de testes.; Atuação: Rafael torna o impedimento visível e articula sua remoção com a infraestrutura.; Apoio: Ele também ajuda a equipe a compreender e aplicar o Scrum.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#2563eb"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Um impedimento de infraestrutura</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#2563eb"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Bloqueio</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">A equipe perdeu o acesso</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">ao ambiente de testes.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#2563eb"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Atuação</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Rafael torna o impedimento</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">visível e articula sua</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">remoção com a</text><text x="450" y="435" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">infraestrutura.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#2563eb"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Apoio</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Ele também ajuda a equipe</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">a compreender e aplicar o</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Scrum.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 4: Papéis do Scrum • Questão 2</text></svg>