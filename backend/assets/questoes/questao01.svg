<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Uma mudança no percurso</title><desc id="desc">Plano inicial: O portal exibiria apenas a nota final.; Teste com candidatos: Os candidatos pedem explicações para as respostas incorretas.; Próxima entrega: A equipe reorganiza as prioridades e acrescenta explicações ao resultado.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#2563eb"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Uma mudança no percurso</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#2563eb"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Plano inicial</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O portal exibiria apenas</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">a nota final.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#2563eb"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Teste com candidatos</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Os candidatos pedem</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">explicações para as</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">respostas incorretas.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#2563eb"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Próxima entrega</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe reorganiza as</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">prioridades e acrescenta</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">explicações ao</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">resultado.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Fundamentos da Agilidade • Questão 1 • Analise as informações do cenário.</text></svg>