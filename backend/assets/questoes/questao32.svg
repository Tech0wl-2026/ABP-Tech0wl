<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Uma previsão depende de hipóteses</title><desc id="desc">Trabalho restante: 60 pontos estimados, usando a escala da própria equipe.; Histórico: Média de 20 pontos concluídos por Sprint em condições semelhantes.; Hipóteses: Escopo, equipe e desempenho permanecem aproximadamente estáveis.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#be185d"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Uma previsão depende de hipóteses</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#be185d"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Trabalho restante</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">60 pontos estimados,</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">usando a escala da própria</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">equipe.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#be185d" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#be185d"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Histórico</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Média de 20 pontos</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">concluídos por Sprint em</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">condições semelhantes.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#be185d" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#be185d"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Hipóteses</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Escopo, equipe e</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">desempenho permanecem</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">aproximadamente estáveis.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 10: Planejamento Ágil • Questão 4</text></svg>