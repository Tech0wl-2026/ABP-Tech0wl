<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Capacidade para a próxima Sprint</title><desc id="desc">Histórico comparável: Nas três últimas Sprints, a mesma equipe concluiu 18, 20 e 22 pontos.; Próxima Sprint: Dois integrantes estarão ausentes por parte do período.; Seleção proposta: Há 30 pontos de itens candidatos, ainda sujeitos à discussão e seleção.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#be185d"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Capacidade para a próxima Sprint</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#be185d"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Histórico comparável</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Nas três últimas Sprints, a</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">mesma equipe concluiu 18,</text><text x="72" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">20 e 22 pontos.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#be185d" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#be185d"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Próxima Sprint</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Dois integrantes estarão</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">ausentes por parte do</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">período.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#be185d" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#be185d"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Seleção proposta</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Há 30 pontos de itens</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">candidatos, ainda sujeitos à</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">discussão e seleção.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 10: Planejamento Ágil • Questão 1</text></svg>