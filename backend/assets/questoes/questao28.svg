<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Um bloqueio precisa continuar visível</title><desc id="desc">Item iniciado: A validação por QR Code está em desenvolvimento.; Impedimento: A equipe aguarda a liberação do domínio necessário para testar.; Política: Itens iniciados e ainda não concluídos contam no WIP, inclusive os bloqueados.</desc><rect width="1200" height="760" fill="#f1f5f9"/><rect width="1200" height="145" fill="#0369a1"/><text x="48" y="44" fill="white" font-family="DejaVu Sans,sans-serif" font-size="19">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="93" fill="white" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="bold">Um bloqueio precisa continuar visível</text><rect x="48" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="90" cy="233" r="23" fill="#0369a1"/><text x="90" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">1</text><text x="72" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Item iniciado</text><text x="72" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">A validação por QR Code</text><text x="72" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">está em desenvolvimento.</text><path d="M 401 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0369a1" stroke-width="3" fill="none"/><rect x="426" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="468" cy="233" r="23" fill="#0369a1"/><text x="468" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">2</text><text x="450" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Impedimento</text><text x="450" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">A equipe aguarda a</text><text x="450" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">liberação do domínio</text><text x="450" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">necessário para testar.</text><path d="M 779 422 h 19 m -7 -7 l 7 7 -7 7" stroke="#0369a1" stroke-width="3" fill="none"/><rect x="804" y="190" width="348" height="464" rx="18" fill="white" stroke="#cbd5e1"/><circle cx="846" cy="233" r="23" fill="#0369a1"/><text x="846" y="241" text-anchor="middle" fill="white" font-family="DejaVu Sans,sans-serif" font-size="23">3</text><text x="828" y="291" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Política</text><text x="828" y="345" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">Itens iniciados e ainda não</text><text x="828" y="375" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">concluídos contam no WIP,</text><text x="828" y="405" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#334155">inclusive os bloqueados.</text><text x="48" y="715" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#475569">Tema 9: Kanban • Questão 4</text></svg>