<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Três observações do trabalho</title><desc id="desc">Momento 1: O quadro mostra a todos que o cronômetro ainda falha em alguns testes.; Momento 2: A equipe examina os testes e verifica que a falha ocorre ao trocar de questão.; Momento 3: A equipe ajusta a implementação e o plano de trabalho para corrigir a falha.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#0f766e"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Três observações do trabalho</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#0f766e"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Momento 1</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O quadro mostra a todos</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">que o cronômetro ainda</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">falha em alguns testes.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#0f766e"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Momento 2</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe examina os</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">testes e verifica que a</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">falha ocorre ao trocar</text><text x="450" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">de questão.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#0f766e"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Momento 3</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe ajusta a</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">implementação e o plano</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">de trabalho para</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">corrigir a falha.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Introdução ao Scrum • Questão 1 • Analise as informações do cenário.</text></svg>