<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="titulo"><title id="titulo">XP: ciclo de TDD</title><rect width="760" height="380" fill="white"/><g font-family="Arial,sans-serif"><text x="30" y="48" font-size="24" font-weight="bold" fill="#17233b">XP: ciclo de TDD</text><rect x="30" y="85" width="700" height="66" rx="10" fill="#eef2f7"/><text x="50" y="125" font-size="21" fill="#17233b">1. Teste falha</text><rect x="30" y="170" width="700" height="66" rx="10" fill="#eef2f7"/><text x="50" y="210" font-size="21" fill="#17233b">2. Código faz o teste passar</text><rect x="30" y="255" width="700" height="66" rx="10" fill="#eef2f7"/><text x="50" y="295" font-size="21" fill="#17233b">3. Melhoria sem mudar o resultado</text><text x="30" y="360" font-size="14" fill="#536074">Leia o cenário e compare as alternativas.</text></g></svg>
