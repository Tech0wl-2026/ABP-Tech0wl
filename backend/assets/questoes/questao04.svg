<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Aprender com o próprio trabalho</title><desc id="desc">Ciclo anterior: A integração das telas gerou conflitos e atrasos.; Conversa da equipe: O grupo identifica que as alterações foram integradas muito tarde.; Ciclo seguinte: A equipe combina integrações menores e frequentes e observa os resultados.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#2563eb"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Aprender com o próprio trabalho</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#2563eb"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Ciclo anterior</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A integração das telas</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">gerou conflitos e</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">atrasos.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#2563eb"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Conversa da equipe</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">O grupo identifica que</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">as alterações foram</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">integradas muito tarde.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#2563eb"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Ciclo seguinte</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe combina</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">integrações menores e</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">frequentes e observa os</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">resultados.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Fundamentos da Agilidade • Questão 4 • Analise as informações do cenário.</text></svg>