<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Uma hipótese colocada à prova</title><desc id="desc">Hipótese: A equipe supõe que o botão Iniciar é fácil de localizar.; Observação: No teste, quatro de cinco candidatos não encontram o botão.; Nova tentativa: A equipe reposiciona o botão e realiza outro teste com candidatos.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#2563eb"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Uma hipótese colocada à prova</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#2563eb"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Hipótese</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe supõe que o</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">botão Iniciar é fácil de</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">localizar.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#2563eb"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Observação</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">No teste, quatro de</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">cinco candidatos não</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">encontram o botão.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#2563eb"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Nova tentativa</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A equipe reposiciona o</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">botão e realiza outro</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">teste com candidatos.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Fundamentos da Agilidade • Questão 3 • Analise as informações do cenário.</text></svg>