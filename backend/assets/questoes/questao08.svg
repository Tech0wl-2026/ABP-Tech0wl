<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Entrega pronta ou demonstração incompleta?</title><desc id="desc">Critério comum: A Definition of Done exige cálculo correto, integração e testes aprovados.; Item X: Exibe uma tela, mas o cálculo da nota está incorreto e os testes falham.; Item Y: Calcula a nota corretamente, está integrado e atende a todos os critérios definidos.</desc><rect width="1200" height="660" fill="#f1f5f9"/><rect width="1200" height="128" fill="#0f766e"/><text x="48" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="20">PORTAL DE CERTIFICAÇÃO EM METODOLOGIAS ÁGEIS</text><text x="48" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Entrega pronta ou demonstração incompleta?</text><rect x="48" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="90" cy="232" r="23" fill="#0f766e"/><text x="90" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">1</text><text x="72" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Critério comum</text><text x="72" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">A Definition of Done</text><text x="72" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">exige cálculo correto,</text><text x="72" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">integração e testes</text><text x="72" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">aprovados.</text><path d="M 401 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="426" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="468" cy="232" r="23" fill="#0f766e"/><text x="468" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">2</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Item X</text><text x="450" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Exibe uma tela, mas o</text><text x="450" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">cálculo da nota está</text><text x="450" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">incorreto e os testes</text><text x="450" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">falham.</text><path d="M 779 365 h 19 m -7 -7 l 7 7 -7 7" stroke="#0f766e" stroke-width="3" fill="none"/><rect x="804" y="188" width="348" height="352" rx="18" fill="#fff" stroke="#cbd5e1"/><circle cx="846" cy="232" r="23" fill="#0f766e"/><text x="846" y="240" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23">3</text><text x="828" y="286" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Item Y</text><text x="828" y="339" font-family="Arial,sans-serif" font-size="22" fill="#334155">Calcula a nota</text><text x="828" y="370" font-family="Arial,sans-serif" font-size="22" fill="#334155">corretamente, está</text><text x="828" y="401" font-family="Arial,sans-serif" font-size="22" fill="#334155">integrado e atende a</text><text x="828" y="432" font-family="Arial,sans-serif" font-size="22" fill="#334155">todos os critérios</text><text x="828" y="463" font-family="Arial,sans-serif" font-size="22" fill="#334155">definidos.</text><text x="48" y="606" font-family="Arial,sans-serif" font-size="20" fill="#475569">Introdução ao Scrum • Questão 4 • Analise as informações do cenário.</text></svg>