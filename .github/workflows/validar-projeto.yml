name: Validar incremento e documentação
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Documentação e sintaxe
        run: |
          python3 scripts/validar-repositorio.py
          python3 -m unittest discover -s testes -p 'test_*.py'
          node --check frontend/js/app.js
          node --check scripts/servidor-local.mjs
          python3 -m py_compile .github/scripts/configurar-project.py
      - name: Dependências de teste
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Subir incremento a partir de banco vazio
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 120
      - name: Integridade no PostgreSQL 17 e consultas preparadas
        run: |
          mkdir -p test-results
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < testes/database.sql | tee test-results/database.txt
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < database/consultas-exemplo.sql
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT version(); SELECT * FROM v_prontidao_base;"' > test-results/ambiente.txt
          docker compose images >> test-results/ambiente.txt
      - name: Navegador desktop/mobile e ausência de JavaScript
        run: npm test
      - name: Diagnóstico
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps > test-results/containers.txt
          docker compose logs --no-color > test-results/containers.log
      - name: Evidências de execução
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validacao-${{ github.sha }}
          path: test-results/
          retention-days: 30
      - name: Encerrar ambiente descartável
        if: always()
        run: docker compose down
